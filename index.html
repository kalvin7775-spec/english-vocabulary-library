/p></div><h3>一起記的搭配詞</h3><ul id="collocations"></ul><div class="actions"><button id="learned" aria-pressed="false">☆ 標記已學會</button><button id="share">複製單字連結</button></div><div class="paging"><button id="prev">← 上一張</button><button id="random">隨機複習</button><button id="next">下一張 →</button></div></div></article></section></main><footer><p>每張圖卡都是一小步，學習不必一次到位。</p><small>發音使用裝置內建語音，需點擊播放；不同裝置的聲音可能不同。學習紀錄只儲存在此瀏覽器。<span id="storageStatus"></span></small><p id="localPrint" hidden><a href="列印版索引.html">開啟本機列印版 PDF</a></p></footer></body></html>
